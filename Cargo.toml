[package]
name = "cawg-consent-test"
version = "0.1.0"
edition = "2021"
description = "Test implementation of a CAWG consent assertion carrying a W3C consent credential"
license = "Apache-2.0 OR MIT"
publish = false

[workspace]
members = [".", "crates/demo-common", "crates/cert-site", "crates/consent-o-tron"]

[dependencies]
anyhow = "1"
base64 = "0.22"
bs58 = "0.5"
c2pa = { version = "0.92.2", features = ["file_io"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
ciborium = "0.2"
ed25519-dalek = { version = "2", features = ["pkcs8", "pem", "rand_core"] }
flate2 = "1"
hex = "0.4"
jsonschema = { version = "0.30", default-features = false }
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_json_canonicalizer = "0.3"
sha2 = "0.10"
x509-parser = { version = "0.17", features = ["verify"] }
