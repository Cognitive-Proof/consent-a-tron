# Tests every push and PR; on main, builds the three images and deploys them
# to Cloud Run in the consent-o-tron project. Authenticates with Workload
# Identity Federation: no service account keys are stored in GitHub.

name: test-and-deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  PROJECT_ID: consent-o-tron
  REGION: us-central1
  REGISTRY: us-central1-docker.pkg.dev/consent-o-tron/consent
  WIF_PROVIDER: projects/186278307043/locations/global/workloadIdentityPools/github/providers/consent-a-tron
  DEPLOYER: github-deployer@consent-o-tron.iam.gserviceaccount.com
  RUNTIME_SA: consent-run@consent-o-tron.iam.gserviceaccount.com
  CERT_SITE_URL: https://certs.cognitive-proof.com
  WALLET_URL: https://wallet.cognitive-proof.com
  CONSENT_SITE_URL: https://consent.cognitive-proof.com

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --locked
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            wallet/package-lock.json
            crates/cert-site/web/package-lock.json
      - run: npm ci && npm run build
        working-directory: wallet
      - run: npm ci && npm run build
        working-directory: crates/cert-site/web

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOYER }}
      - uses: google-github-actions/setup-gcloud@v2
      - run: gcloud auth configure-docker "${REGISTRY%%/*}" --quiet

      - uses: docker/setup-buildx-action@v3

      - name: Build cert-site
        uses: docker/build-push-action@v6
        with:
          context: .
          build-args: BIN=cert-site
          push: true
          tags: ${{ env.REGISTRY }}/cert-site:${{ github.sha }}
          cache-from: type=gha,scope=cert-site
          cache-to: type=gha,mode=max,scope=cert-site

      - name: Build consent-o-tron
        uses: docker/build-push-action@v6
        with:
          context: .
          build-args: BIN=consent-o-tron
          push: true
          tags: ${{ env.REGISTRY }}/consent-o-tron:${{ github.sha }}
          cache-from: type=gha,scope=consent-o-tron
          cache-to: type=gha,mode=max,scope=consent-o-tron

      - name: Build wallet
        uses: docker/build-push-action@v6
        with:
          context: wallet
          build-args: |
            VITE_CERT_SITE_URL=${{ env.CERT_SITE_URL }}
            VITE_CONSENT_SITE_URL=${{ env.CONSENT_SITE_URL }}
          push: true
          tags: ${{ env.REGISTRY }}/wallet:${{ github.sha }}
          cache-from: type=gha,scope=wallet
          cache-to: type=gha,mode=max,scope=wallet

      - name: Deploy
        run: |
          set -euo pipefail
          urls="CERT_SITE_URL=$CERT_SITE_URL,WALLET_URL=$WALLET_URL,CONSENT_SITE_URL=$CONSENT_SITE_URL,MONGODB_DB=consent-demo"

          # Stripe and Resend are optional: attach them only once the secrets exist.
          optional() {
            for name in "$@"; do
              if gcloud secrets describe "$name" --project "$PROJECT_ID" >/dev/null 2>&1; then
                printf ',%s=%s:latest' "$name" "$name"
              fi
            done
          }

          gcloud run deploy cert-site --project "$PROJECT_ID" --region "$REGION" \
            --image "$REGISTRY/cert-site:$GITHUB_SHA" \
            --service-account "$RUNTIME_SA" --allow-unauthenticated \
            --max-instances 2 \
            --set-env-vars "$urls" \
            --set-secrets "MONGODB_URI=MONGODB_URI:latest,PKI_CAWG_ROOT_PEM=PKI_CAWG_ROOT_PEM:latest,PKI_CAWG_ROOT_KEY=PKI_CAWG_ROOT_KEY:latest,PKI_CONSENT_O_TRON_KEY=PKI_CONSENT_O_TRON_KEY:latest$(optional STRIPE_SECRET_KEY RESEND_API_KEY EMAIL_FROM)"

          # One instance with CPU always on: the wallet hand-off during
          # authoring lives in memory and runs after the HTTP response.
          gcloud run deploy consent-o-tron --project "$PROJECT_ID" --region "$REGION" \
            --image "$REGISTRY/consent-o-tron:$GITHUB_SHA" \
            --service-account "$RUNTIME_SA" --allow-unauthenticated \
            --min-instances 0 --max-instances 1 --no-cpu-throttling --memory 1Gi \
            --set-env-vars "$urls,GCS_BUCKET=consent-o-tron-files" \
            --set-secrets "MONGODB_URI=MONGODB_URI:latest,PKI_CAWG_ROOT_PEM=PKI_CAWG_ROOT_PEM:latest,PKI_C2PA_ROOT_PEM=PKI_C2PA_ROOT_PEM:latest,PKI_CONSENT_O_TRON_KEY=PKI_CONSENT_O_TRON_KEY:latest,PKI_CLAIM_SIGNER_KEY=PKI_CLAIM_SIGNER_KEY:latest,PKI_CLAIM_SIGNER_CHAIN_PEM=PKI_CLAIM_SIGNER_CHAIN_PEM:latest$(optional RESEND_API_KEY EMAIL_FROM)"

          gcloud run deploy wallet --project "$PROJECT_ID" --region "$REGION" \
            --image "$REGISTRY/wallet:$GITHUB_SHA" \
            --service-account "$RUNTIME_SA" --allow-unauthenticated \
            --max-instances 2 --port 8080 \
            --set-env-vars "FRAME_ANCESTORS=$CERT_SITE_URL $CONSENT_SITE_URL"
