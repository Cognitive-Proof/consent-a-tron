# Local services for the demo sites.
# The project name is pinned so the existing local MongoDB container and
# volume (created when this repo lived in a folder of that name) keep working.
name: cawg-consent-test
services:
  mongo:
    image: mongo:8.0
    ports:
      - "127.0.0.1:27019:27017"
    volumes:
      - mongo-data:/data/db
volumes:
  mongo-data:
