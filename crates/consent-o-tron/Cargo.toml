[package]
name = "consent-o-tron"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
anyhow = "1"
axum = { version = "0.8", features = ["multipart"] }
base64 = "0.22"
c2pa = { version = "0.92.2", features = ["file_io"] }
c2pa_raw_crypto = { version = "0.3.0", default-features = false }
cawg-consent-test = { path = "../.." }
demo-common = { path = "../demo-common" }
ciborium = "0.2"
futures-util = "0.3"
ed25519-dalek = "2"
rand = "0.8"
reqwest = { version = "0.13", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
